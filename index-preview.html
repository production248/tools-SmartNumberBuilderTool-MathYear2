<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc129">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="An interactive place-value and number-sense tool for Malaysian Math Year 2 pupils.">
  <title>Smart Number Builder - Math Year 2</title>
  <link rel="icon" type="image/png" href="edcloud-app-icon.png">
  <link rel="preload" href="assets/ui-icons/sound-off.png" as="image" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Local preview entry: intentionally bypasses EdCloud authorization. -->
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="edcloud-app-icon.png" alt="" aria-hidden="true">
        <div>
          <h1 data-i18n="appTitle">Jom Bina Nombor!</h1>
          <p data-i18n="appSubtitle">Susun, tukar dan fahami nilai nombor.</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="fullscreen-toggle" id="fullscreenToggle" type="button">
          <span aria-hidden="true">⛶</span>
          <span data-i18n="fullscreen">Skrin penuh</span>
        </button>
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">
          <img id="soundIcon" class="sound-icon" src="assets/ui-icons/sound-on.png" width="28" height="28" alt="" aria-hidden="true" draggable="false">
          <span id="soundLabel" data-i18n="soundOn">Bunyi</span>
        </button>
        <div class="language-switch" role="group" aria-label="Language">
          <button class="language-btn active" type="button" data-lang="bm" aria-pressed="true">BM</button>
          <button class="language-btn" type="button" data-lang="zh" aria-pressed="false">中文</button>
          <button class="language-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main>
      <nav class="mode-tabs" id="modeTabs" aria-label="Learning modes">
        <button class="mode-tab" type="button" data-mode="readwrite" aria-pressed="false">
          <img class="mode-icon" src="assets/mode-icons/read-write.png" width="40" height="40" alt="" aria-hidden="true" draggable="false">
          <span class="mode-label" data-i18n="modeReadwrite">Baca &amp; Tulis</span>
        </button>
        <button class="mode-tab active" type="button" data-mode="build" aria-pressed="true">
          <img class="mode-icon" src="assets/mode-icons/build.png" width="40" height="40" alt="" aria-hidden="true" draggable="false">
          <span class="mode-label" data-i18n="modeBuild">Bina</span>
        </button>
        <button class="mode-tab" type="button" data-mode="decompose" aria-pressed="false">
          <img class="mode-icon" src="assets/mode-icons/split.png" width="40" height="40" alt="" aria-hidden="true" draggable="false">
          <span class="mode-label" data-i18n="modeDecompose">Cerai</span>
        </button>
        <button class="mode-tab" type="button" data-mode="extreme" aria-pressed="false">
          <img class="mode-icon" src="assets/mode-icons/compare.png" width="40" height="40" alt="" aria-hidden="true" draggable="false">
          <span class="mode-label" data-i18n="modeExtreme">Terbesar / Terkecil</span>
        </button>
        <button class="mode-tab" type="button" data-mode="order" aria-pressed="false">
          <img class="mode-icon" src="assets/mode-icons/order.png" width="40" height="40" alt="" aria-hidden="true" draggable="false">
          <span class="mode-label" data-i18n="modeOrder">Susun</span>
        </button>
      </nav>

      <section class="workspace">
        <section class="visual-panel" aria-labelledby="promptText">
          <div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div>

          <div class="prompt-row">
            <div class="prompt-copy">
              <span class="eyebrow" data-i18n="yourTask">Mari cuba!</span>
              <h2 id="promptText">Bina nombor ini.</h2>
            </div>

            <div class="prompt-tools">
              <div id="controlsHost">
                <label class="field" for="levelSelect">
                  <span data-i18n="level">Tahap</span>
                  <select id="levelSelect">
                    <option value="d1" data-i18n="levelD1">D1 (0–100)</option>
                    <option value="d2" data-i18n="levelD2">D2 (0–1,000)</option>
                    <option value="d3" data-i18n="levelD3">D3 (0–10,000)</option>
                    <option value="d4" data-i18n="levelD4">D4 (0–100,000)</option>
                    <option value="d5" data-i18n="levelD5">D5 (0–1,000,000)</option>
                    <option value="d6" data-i18n="levelD6">D6 (0–10,000,000)</option>
                  </select>
                </label>

                <label class="field" id="readDirectionField" for="readDirectionSelect" hidden>
                  <span data-i18n="practiceType">Jenis latihan</span>
                  <select id="readDirectionSelect">
                    <option value="random" data-i18n="randomOption">Rawak</option>
                    <option value="numberToWords" data-i18n="numberToWordsOption">Nombor → perkataan</option>
                    <option value="wordsToNumber" data-i18n="wordsToNumberOption">Perkataan → nombor</option>
                  </select>
                </label>

                <label class="field" id="extremeObjectiveField" for="extremeObjectiveSelect" hidden>
                  <span data-i18n="questionType">Jenis soalan</span>
                  <select id="extremeObjectiveSelect">
                    <option value="random" data-i18n="randomOption">Rawak</option>
                    <option value="largest" data-i18n="largestOption">Nombor terbesar</option>
                    <option value="smallest" data-i18n="smallestOption">Nombor terkecil</option>
                  </select>
                </label>
              </div>
              <span class="level-badge" id="levelBadge">D2</span>
            </div>
          </div>

          <div class="challenge-display" id="challengeDisplay" aria-live="polite"></div>

          <div class="concept-stage" id="conceptStage"></div>

          <section class="card-bank-section" aria-labelledby="cardBankTitle">
            <div class="bank-heading">
              <h3 id="cardBankTitle">Kad nombor</h3>
              <span id="bankHint">Tekan atau seret</span>
            </div>
            <div class="card-bank" id="cardBank"></div>
          </section>

          <div class="action-dock">
            <div class="feedback" id="feedback" aria-live="polite"></div>
            <div class="answer-actions">
              <button class="secondary-btn new-question-btn" id="newQuestionBtn" type="button">
                <span aria-hidden="true">✦</span><span data-i18n="newQuestion">Soalan baharu</span>
              </button>
              <button class="secondary-btn" id="resetBtn" type="button">
                <span aria-hidden="true">↺</span><span data-i18n="reset">Semula</span>
              </button>
              <button class="primary-btn" id="checkBtn" type="button">
                <span aria-hidden="true">✓</span><span data-i18n="check">Semak</span>
              </button>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <dialog
    class="success-dialog"
    id="successDialog"
    aria-labelledby="successDialogTitle"
    aria-describedby="successDialogCheer"
  >
    <div class="success-dialog-card">
      <div class="success-celebration-layer" id="successCelebrationLayer" aria-hidden="true"></div>
      <div class="success-spark-field" aria-hidden="true">
        <span class="success-spark success-spark-1">✦</span>
        <span class="success-spark success-spark-2">★</span>
        <span class="success-spark success-spark-3">✦</span>
        <span class="success-spark success-spark-4">★</span>
        <span class="success-spark success-spark-5">✦</span>
        <span class="success-spark success-spark-6">★</span>
      </div>

      <div class="success-medal-wrap" aria-hidden="true">
        <span class="success-halo success-halo-1"></span>
        <span class="success-halo success-halo-2"></span>
        <span class="success-medal">✓</span>
      </div>

      <p class="success-dialog-cheer" id="successDialogCheer">Hebat! Kamu berjaya menyelesaikannya.</p>
      <h2 class="success-dialog-title" id="successDialogTitle">Betul!</h2>
      <div class="success-dialog-answer" id="successDialogAnswer"></div>

      <div class="success-dialog-actions">
        <button class="secondary-btn" id="successReviewBtn" type="button">Lihat jawapan</button>
        <button class="primary-btn" id="successNextBtn" type="button" autofocus>Soalan seterusnya</button>
      </div>
    </div>
  </dialog>

  <script src="grade-config.js"></script>
  <script src="shared-components-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
